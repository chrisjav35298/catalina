
# This file is the entry point to configure your own services.
# Files in the packages/subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    uploads_directory: '%kernel.project_dir%/public/uploads'

    meta.instagram_user_id: '%env(META_INSTAGRAM_USER_ID)%'
    meta.instagram_access_token: '%env(META_INSTAGRAM_ACCESS_TOKEN)%'

services:
    # Default configuration for services in this file
    _defaults:
        autowire: true
        autoconfigure: true

    # Makes classes in src/ available as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Explicit configuration for the Instagram publisher
    App\Service\InstagramPublisher:
        autowire: false
        autoconfigure: false
        arguments:
            - '@http_client'
            - '%meta.instagram_user_id%'
            - '%meta.instagram_access_token%'
